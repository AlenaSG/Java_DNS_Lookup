name: Build JAR

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Compile and package JAR
        run: |
          mkdir -p out
          javac -d out NetworkInspector.java
          jar cfe NetworkInspector.jar NetworkInspector -C out .

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetworkInspector-jar
          path: NetworkInspector.jar
